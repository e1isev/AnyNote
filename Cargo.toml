[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/e1isev/AnyNote"
rust-version = "1.85"

[workspace.dependencies]
anynote-core = { path = "crates/anynote-core" }
anynote-onenote = { path = "crates/anynote-onenote" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yrs = "0.28"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
pulldown-cmark = { version = "0.13", default-features = false }
onenote_parser = "2.1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
